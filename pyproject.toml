[project]
name = "prospectus-checker"
version = "0.1.0"
description = "Compare selected prospectus investment tables with a periodic fund report"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "python-multipart>=0.0.9,<1",
  "python-dotenv>=1.0,<2",
  "pymupdf>=1.24,<2",
  "langchain>=0.1.0,<2",
  "langchain-openai>=0.1.0,<2",
  "langgraph>=1.2.10,<2",
  "firecrawl-anydoc==0.2.4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.27,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
